<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Virtual</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header id="topo">
    <h1>Biblioteca Virtual</h1>
    <nav>
      <a href="#catalogo">Catálogo de Livros</a>
      <a href="#sugestoes">Sugerir Aquisição</a>
    </nav>
  </header>

  <main>
    <section id="catalogo">
      <h2>Nosso Acervo</h2>
      <div class="campo-busca">
        <label for="busca">Pesquisar livro:</label>
        <input type="search" id="busca" placeholder="Digite o título...">
      </div>
      <div class="grade-livros">
        <article>
          <h3>O Senhor dos Anéis</h3>
        </article>
        <article>
          <h3>1984</h3>
        </article>
        <article>
          <h3>Dom Casmurro</h3>
        </article>
        <article>
          <h3>Fundação</h3>
        </article>
        <article>
          <h3>O Pequeno Príncipe</h3>
        </article>
        <article>
          <h3>Fahrenheit 451</h3>
        </article>
      </div>
    </section>

    <section id="sugestoes">
      <h2>Sugerir Novo Livro</h2>
      <form action="#" method="post" id="form-sugestao">
        <div class="campo-form">
          <label for="nome">Seu Nome</label>
          <input type="text" id="nome" name="nome">
        </div>
        <div class="campo-form">
          <label for="titulo">Título da Obra</label>
          <input type="text" id="titulo" name="titulo">
        </div>
        <button type="submit">Enviar Sugestão</button>
        <p id="mensagem" class="mensagem"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>Desenvolvimento Web - Biblioteca Virtual</p>
    <a href="#topo">Voltar ao topo</a>
  </footer>
</body>
</html>
